name: Web Application CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check repository files
        run: |
          git status --short
          echo "Repository checkout successful"

      - name: Code quality check
        run: |
          git diff --check
          echo "Code quality check passed"


@'
name: SCM Project CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check repository files
        run: |
          test -f README.md
          echo "README.md exists."

      - name: Check Markdown documentation
        run: |
          files=$(find . -type f -name "*.md" -not -path "./.git/*")
          if [ -z "$files" ]; then
            echo "Error: No Markdown files found."
            exit 1
          fi
          echo "Markdown documentation found:"
          echo "$files"
'@ | Set-Content -Path ".github/workflows/ci.yml" -Encoding utf8
